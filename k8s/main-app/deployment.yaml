apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app
  labels:
    app: main-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: main-app
  template:
    metadata:
      labels:
        app: main-app
    spec:
      containers:
        - name: main-app
          image: 921876749360.dkr.ecr.us-east-1.amazonaws.com/main-app:latest
          ports:
            - containerPort: 5111
          envFrom:
            - configMapRef:
                name: main-app-config
            - secretRef:
                name: main-app-secrets
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 5111 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: 5111 }
            initialDelaySeconds: 5
            periodSeconds: 10